name: Update RVM Status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch RVM Data & Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: "9b1a398db23afbc76d90bc390d0c65db"
        run: |
          cat << 'EOF' > update_script.py
          import json, requests

          url = "https://albarvm.teamnote.work/api/rvm/"
          headers = {
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Origin": "https://hkrvms3.com.hk",
              "Referer": "https://hkrvms3.com.hk/"
          }

          try:
              res = requests.post(url, json={}, headers=headers, timeout=10)
              if res.status_code == 200:
                  res_json = res.json()
                  raw_data = res_json.get("data", res_json) if isinstance(res_json, dict) else res_json

                  print(f"=== 全港機台總數: {len(raw_data)} ===")
                  if isinstance(raw_data, list):
                      for idx, item in enumerate(raw_data, start=1):
                          if not isinstance(item, dict):
                              continue
                          
                          name_zht = item.get("name_zht") or item.get("name") or "無名稱"
                          addr_zht = item.get("address_zht") or item.get("address") or "無地址"
                          
                          print(f"[{idx}] {name_zht} | {addr_zht}")
          except Exception as e:
              print(f"Error: {e}")
          EOF
          python update_script.py
