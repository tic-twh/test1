name: Update RVM Status

on:
  schedule:
    - cron: '*/5 * * * *' # 每 5 分鐘自動執行一次
  workflow_dispatch: # 支援手動觸發

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch RVM Data & Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: "9b1a398db23afbc76d90bc390d0c65db"
        run: |
          python3 -c '
          import os, json, urllib.request, urllib.error

          gist_token = os.environ.get("GIST_TOKEN")
          gist_id = os.environ.get("GIST_ID")

          url = "https://albarvm.teamnote.work/api/rvm/"
          headers = {
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Origin": "https://hkrvms3.com.hk",
              "Referer": "https://hkrvms3.com.hk/"
          }

          filtered_data = []

          try:
              req = urllib.request.Request(url, data=b"{}", headers=headers, method="POST")
              with urllib.request.urlopen(req, timeout=10) as response:
                  if response.status == 200:
                      res_json = json.loads(response.read().decode("utf-8"))
                      raw_data = res_json.get("data") or res_json.get("results") or res_json
                      if isinstance(raw_data, list):
                          for item in raw_data:
                              name = item.get("name_tc", "") or item.get("name", "") or ""
                              if "彩園" in name or "名都" in name:
                                  cap = int(item.get("capacity") or item.get("cap") or 0)
                                  status_raw = str(item.get("status", "")).upper()
                                  is_online = item.get("is_online", True)

                                  if "OFF" in status_raw or "MAIN" in status_raw or not is_online:
                                      status = "MAINTENANCE"
                                  elif "FULL" in status_raw or cap >= 95:
                                      status = "FULL"
                                  elif "ALMOST" in status_raw or cap >= 80:
                                      status = "ALMOST_FULL"
                                  else:
                                      status = "SERVICE"

                                  filtered_data.append({"name": name, "cap": cap, "status": status})
          except Exception as e:
              print(f"API Fetch Error: {e}")

          if not filtered_data:
              print("Using fallback default data...")
              filtered_data = [
                  {"name": "彩園邨彩園商場地下入口處", "cap": 0, "status": "SERVICE"},
                  {"name": "上水名都商場 L2 平台", "cap": 0, "status": "SERVICE"}
              ]

          gist_url = f"https://api.github.com/gists/{gist_id}"
          gist_headers = {
              "Authorization": f"token {gist_token}",
              "Accept": "application/vnd.github.v3+json",
              "Content-Type": "application/json"
          }
          payload = {
              "files": {
                  "rvm.json": {
                      "content": json.dumps(filtered_data, ensure_ascii=False)
                  }
              }
          }
          
          patch_req = urllib.request.Request(
              gist_url, 
              data=json.dumps(payload).encode("utf-8"), 
              headers=gist_headers, 
              method="PATCH"
          )
          with urllib.request.urlopen(patch_req) as patch_res:
              print(f"Gist Patch Status: {patch_res.status}")
          '
