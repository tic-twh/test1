name: Update RVM Status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch RVM Data & Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: "9b1a398db23afbc76d90bc390d0c65db"
        run: |
          python -c '
          import os, json, requests

          url = "https://albarvm.teamnote.work/api/rvm/"
          headers = {
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Origin": "https://hkrvms3.com.hk",
              "Referer": "https://hkrvms3.com.hk/"
          }

          try:
              res = requests.post(url, json={}, headers=headers, timeout=10)
              if res.status_code == 200:
                  res_json = res.json()
                  # 如果外層是 dict 就取 data，如果是 list 就直接用
                  raw_data = res_json.get("data", res_json) if isinstance(res_json, dict) else res_json
                  
                  print("=== 正在搜尋北區/上水附近的所有站點名稱 ===")
                  if isinstance(raw_data, list):
                      for item in raw_data:
                          if isinstance(item, dict):
                              name_zht = str(item.get("name_zht") or item.get("name") or "")
                              addr_zht = str(item.get("address_zht") or item.get("address") or "")
                              
                              # 關鍵字篩選
                              if any(k in name_zht + addr_zht for k in ["上水", "粉嶺", "北區", "彩", "名都"]):
                                  print(f"👉 找到站點 | 名稱: {name_zht} | 地址: {addr_zht} | 狀態: {item.get(\"status\")}")
          except Exception as e:
              print(f"Error: {e}")
          '
