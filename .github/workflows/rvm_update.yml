name: Update RVM Status

on:
  schedule:
    - cron: '*/5 * * * *' # 每 5 分鐘自動執行一次
  workflow_dispatch: # 支援手動觸發

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Process RVM Data
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: "9b1a398db23afbc76d90bc390d0c65db"
        run: |
          # 1. 強制設定 Google DNS (8.8.8.8) 避免 GitHub Runner 本身 DNS 解析失敗 (Exit code 6)
          sudo sed -i '1s/^/nameserver 8.8.8.8\nnameserver 1.1.1.1\n/' /etc/resolv.conf

          # 2. 向環保署 API 發送 POST 請求
          RESPONSE=$(curl -s --connect-timeout 10 --retry 3 --retry-delay 2 -X POST "https://hkrvm.com.hk/hkrvm/api/rvm/getMapList" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36")

          # 3. 檢查 Response 是否為空或非 JSON
          if [ -z "$RESPONSE" ] || ! echo "$RESPONSE" | jq . >/dev/null 2>&1; then
            echo "Warning: API 請求失敗，寫入預設 fallback 數據"
            FILTERED_JSON='[{"name":"彩園邨彩園商場地下入口處","cap":0,"status":"SERVICE"},{"name":"上水名都商場 L2 平台","cap":0,"status":"SERVICE"}]'
          else
            # 4. 解析遠端 JSON 數據
            FILTERED_JSON=$(echo "$RESPONSE" | jq '[
              .data[]? | select(.name_tc != null) | select(.name_tc | contains("彩園") or contains("名都")) | {
                name: .name_tc,
                cap: (.capacity // .cap // 0 | tonumber),
                status: (
                  if (.status | tostring | test("OFF|MAIN|^0$|^3$")) or (.is_online == false) then "MAINTENANCE"
                  elif (.status | tostring | test("FULL|^2$")) or ((.capacity // 0 | tonumber) >= 95) then "FULL"
                  elif (.status | tostring | test("ALMOST")) or ((.capacity // 0 | tonumber) >= 80) then "ALMOST_FULL"
                  else "SERVICE"
                  end
                )
              }
            ]')
          fi

          # 5. 更新 GitHub Gist
          PAYLOAD=$(jq -n --arg content "$FILTERED_JSON" '{files: {"rvm.json": {content: $content}}}')
          curl -s -X PATCH "https://api.github.com/gists/$GIST_ID" \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -d "$PAYLOAD"
