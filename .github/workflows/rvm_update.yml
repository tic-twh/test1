name: Update RVM Status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch RVM Data & Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: "9b1a398db23afbc76d90bc390d0c65db"
        run: |
          cat << 'EOF' > update_script.py
          import os, json, requests

          url = "https://albarvm.teamnote.work/api/rvm/"
          headers = {
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Origin": "https://hkrvms3.com.hk",
              "Referer": "https://hkrvms3.com.hk/"
          }

          try:
              res = requests.post(url, json={}, headers=headers, timeout=15)
              print(f"API Response Type: {type(res.json())}")
              
              data = res.json()
              
              # 如果外層是 dict，印出它所有的 Key
              if isinstance(data, dict):
                  print(f"Root Dict Keys: {list(data.keys())}")
                  # 檢查常見的包裝 Key
                  for k in ["results", "data", "items", "rvms", "list"]:
                      if k in data:
                          print(f"Key '{k}' 裡面的資料型態: {type(data[k])}, 長度: {len(data[k]) if hasattr(data[k], '__len__') else 'N/A'}")

              # 如果外層是 list，印出第一個元素的 Key
              elif isinstance(data, list):
                  print(f"Root List 長度: {len(data)}")
                  if len(data) > 0 and isinstance(data[0], dict):
                      print(f"第一個元素的 Keys: {list(data[0].keys())}")

          except Exception as e:
              print(f"解析 Error: {e}")
          EOF
          python update_script.py
