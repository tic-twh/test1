name: Update RVM Status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch RVM Data & Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: "9b1a398db23afbc76d90bc390d0c65db"
        run: |
          cat << 'EOF' > update_script.py
          import json, requests

          url = "https://albarvm.teamnote.work/api/rvm/"
          headers = {
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Origin": "https://hkrvms3.com.hk",
              "Referer": "https://hkrvms3.com.hk/"
          }

          try:
              res = requests.post(url, json={}, headers=headers, timeout=10)
              if res.status_code == 200:
                  res_json = res.json()
                  raw_data = res_json.get("data", res_json) if isinstance(res_json, dict) else res_json

                  print("=== 🔍 開始列出北區 / 上水附近所有機台列表 ===")
                  if isinstance(raw_data, list):
                      found_count = 0
                      for item in raw_data:
                          if not isinstance(item, dict):
                              continue

                          # 收集該機台的所有可能文字欄位
                          all_text = " ".join([
                              str(item.get("name_zht", "")),
                              str(item.get("name_en", "")),
                              str(item.get("name", "")),
                              str(item.get("address_zht", "")),
                              str(item.get("address_en", "")),
                              str(item.get("district", ""))
                          ])

                          # 只要包含北區、上水、粉嶺或 Sheung Shui 等關鍵字就印出
                          keywords = ["彩", "名都", "上水", "NORTH", "SHEUNG SHUI", "CHOI YUEN"]
                          if any(k.upper() in all_text.upper() for k in keywords):
                              found_count += 1
                              print(f"📍 機台 {found_count}:")
                              print(f"   - name_zht : {item.get('name_zht')}")
                              print(f"   - name_en  : {item.get('name_en')}")
                              print(f"   - address  : {item.get('address_zht')}")
                              print(f"   - bin_count: {item.get('bin_count')}")
                              print(f"   - status   : {item.get('status')}")
                              print("-" * 50)
          except Exception as e:
              print(f"Error: {e}")
          EOF
          python update_script.py
