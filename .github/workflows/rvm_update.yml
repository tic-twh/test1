name: Update RVM Status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch RVM Data & Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: "9b1a398db23afbc76d90bc390d0c65db"
        run: |
          python -c '
          import os, json, requests, sys

          gist_token = os.environ.get("GIST_TOKEN")
          gist_id = os.environ.get("GIST_ID")

          url = "https://albarvm.teamnote.work/api/rvm/"
          headers = {
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Origin": "https://hkrvms3.com.hk",
              "Referer": "https://hkrvms3.com.hk/"
          }

          filtered_data = []

          try:
              res = requests.post(url, json={}, headers=headers, timeout=10)
              if res.status_code == 200:
                  raw_data = res.json()
                  if isinstance(raw_data, list):
                      for item in raw_data:
                          # 取得中文名稱與位址
                          name_zht = item.get("name_zht", "") or item.get("name", "")
                          addr_zht = item.get("address_zht", "") or ""
                          full_text = name_zht + addr_zht

                          # 匹配彩園與名都機台
                          if "彩園" in full_text or "名都" in full_text:
                              bin_count = item.get("bin_count", 0)
                              # 假設最高容量約 1200 個樽，計算估計百分比 (上限 100%)
                              cap_percent = min(100, int((bin_count / 1200.0) * 100))

                              status_raw = str(item.get("status", "")).upper()
                              under_maint = item.get("under_maintenance", False)

                              # 判斷顯示狀態
                              if under_maint or "OFF" in status_raw or "MAINT" in status_raw:
                                  status = "MAINTENANCE"
                              elif "FULL" in status_raw or cap_percent >= 95:
                                  status = "FULL"
                              elif "ALMOST" in status_raw or cap_percent >= 80:
                                  status = "ALMOST_FULL"
                              else:
                                  status = "SERVICE"

                              display_name = "彩園邨彩園商場地下入口處" if "彩園" in full_text else "上水名都商場 L2 平台"
                              filtered_data.append({
                                  "name": display_name,
                                  "cap": cap_percent,
                                  "status": status
                              })
                              print(f"✅ 成功匹配: {display_name} | 樽數: {bin_count} ({cap_percent}%) | 狀態: {status}")
          except Exception as e:
              print(f"API Error: {e}")

          if not filtered_data:
              print("❌ 警告: 未搜到資料，載入預設值")
              filtered_data = [
                  {"name": "彩園邨彩園商場地下入口處", "cap": 0, "status": "SERVICE"},
                  {"name": "上水名都商場 L2 平台", "cap": 0, "status": "SERVICE"}
              ]

          # 更新 Gist
          gist_url = f"https://api.github.com/gists/{gist_id}"
          gist_headers = {
              "Authorization": f"token {gist_token}",
              "Accept": "application/vnd.github.v3+json"
          }
          payload = {
              "files": {
                  "rvm.json": {
                      "content": json.dumps(filtered_data, ensure_ascii=False, indent=2)
                  }
              }
          }
          
          patch_res = requests.patch(gist_url, json=payload, headers=gist_headers)
          print(f"Gist 更新結果 Status Code: {patch_res.status_code}")
          '
