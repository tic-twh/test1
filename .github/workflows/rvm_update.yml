name: Update RVM Status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch RVM Data & Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: "9b1a398db23afbc76d90bc390d0c65db"
        run: |
          cat << 'EOF' > update_script.py
          import json, requests

          url = "https://albarvm.teamnote.work/api/rvm/"
          headers = {
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Origin": "https://hkrvms3.com.hk",
              "Referer": "https://hkrvms3.com.hk/"
          }

          # 測試不同的分頁與全量請求 Payload
          payloads = [
              {"page_size": 200},
              {"limit": 200},
              {"all": True},
              {}
          ]

          raw_data = []

          for p in payloads:
              try:
                  res = requests.post(url, json=p, headers=headers, timeout=10)
                  if res.status_code == 200:
                      res_json = res.json()
                      data = res_json.get("results", res_json.get("data", res_json)) if isinstance(res_json, dict) else res_json
                      if isinstance(data, list) and len(data) > len(raw_data):
                          raw_data = data
              except Exception as e:
                  pass

          print(f"=== 成功解鎖！抓取到機台總數: {len(raw_data)} ===")

          if isinstance(raw_data, list):
              for idx, item in enumerate(raw_data, start=1):
                  if not isinstance(item, dict):
                      continue
                  
                  name_zht = item.get("name_zht") or item.get("name") or "無名稱"
                  addr_zht = item.get("address_zht") or item.get("address") or "無地址"
                  
                  # 印出包含彩、名都、上水、北區的機台
                  full_info = name_zht + addr_zht
                  if any(k in full_info for k in ["彩", "名都", "上水", "粉嶺", "北區"]):
                      print(f"👉 [{idx}] {name_zht} | {addr_zht}")
          EOF
          python update_script.py
